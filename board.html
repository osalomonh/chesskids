<!--
  Build:
    npm run build
    (only needed once, or whenever moves.ts/game.ts change; produces
    moves.js and game.js as ESM)

  Serve (ES modules do not load over file://):
    python -m http.server 8000

  View:
    http://localhost:8000/board.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
<style>
  /* Minimal, structural only. Visual design belongs to the design layer;
     these rules exist so the page is legible and the touch targets are big
     enough. Class hooks a stylesheet will want are named below. */

  html, body {
    height: 100%;
    margin: 0;
    background: #2b2b2b;
    font-family: sans-serif;
    color: #eee;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }

  /* --- screens ---------------------------------------------------------- */

  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .screen[hidden] {
    display: none;
  }

  /* --- setup screen ----------------------------------------------------- */

  .setup-prompt {
    font-size: 22px;
    margin-bottom: 16px;
  }

  .color-choice {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .color-option {
    min-width: 100px;
    min-height: 60px;
    font-size: 18px;
    font-family: inherit;
    border: 3px solid #1a1a1a;
    border-radius: 8px;
    background: #f0d9b5;
    color: #1a1a1a;
    cursor: pointer;
  }

  .color-option[aria-pressed="true"] {
    outline: 4px solid #2e9bff;
    outline-offset: -4px;
  }

  .play-button {
    min-width: 180px;
    min-height: 60px;
    font-size: 22px;
    font-family: inherit;
    border: 3px solid #1a1a1a;
    border-radius: 8px;
    background: #6fc36f;
    color: #1a1a1a;
    cursor: pointer;
  }

  /* --- game screen ------------------------------------------------------ */

  /* Off the board, not on it: the status line lives here, not in a square. */
  .status-line {
    margin-bottom: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 18px;
    color: #eee;
    background: #1a1a1a;
    text-align: center;
  }

  .board {
    display: grid;
    border: 4px solid #1a1a1a;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }

  .square {
    width: 72px;
    height: 72px;
    min-width: 60px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    user-select: none;
    cursor: pointer;
  }

  .square.light {
    background: #f0d9b5;
  }

  .square.dark {
    background: #b58863;
  }

  .square.selected {
    outline: 4px solid #2e9bff;
    outline-offset: -4px;
  }

  .square.highlight::after {
    content: "";
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: rgba(30, 130, 30, 0.65);
  }

  /* When the highlighted square is occupied (a capture), show a ring
     instead of a dot, so the destination is still visible under the piece. */
  .square.highlight.occupied::after {
    width: 82%;
    height: 82%;
    background: transparent;
    border: 6px solid rgba(200, 30, 30, 0.65);
    box-sizing: border-box;
  }

  .piece {
    font-size: 48px;
    line-height: 1;
    pointer-events: none;
    z-index: 1;
  }

  .piece.white {
    color: #fefefe;
    text-shadow: 0 0 2px #000, 0 0 2px #000;
  }

  .piece.black {
    color: #111;
  }
</style>
</head>
<body>

<!-- SCREEN 1: setup -->
<section class="screen setup-screen" id="setup-screen">
  <p class="setup-prompt">Which colour do you want to play?</p>

  <div class="color-choice" id="color-choice" role="group" aria-label="Choose a colour">
    <button class="color-option" type="button" data-choice="white" aria-pressed="true">White</button>
    <button class="color-option" type="button" data-choice="black" aria-pressed="false">Black</button>
    <button class="color-option" type="button" data-choice="random" aria-pressed="false">Surprise me</button>
  </div>

  <button class="play-button" type="button" id="play-button">Play</button>
</section>

<!-- SCREEN 2: game -->
<section class="screen game-screen" id="game-screen" hidden>
  <div class="status-line" id="status-line"></div>
  <div class="board" id="board"></div>
</section>

<script type="module">
  import { applyMove, legalMovesFrom, sideToMove, gameStatus } from "./game.js";

  // ======================================================================
  // Starting position — DATA. The 8 below describes this one position; the
  // drawing code further down reads board.size and never assumes a number.
  // ======================================================================

  const STANDARD_SIZE = 8;

  // Files 0..7 of a back rank: rook, knight, bishop, queen, king, bishop,
  // knight, rook. Queen on file 3, king on file 4.
  const BACK_RANK = [
    "rook", "knight", "bishop", "queen", "king", "bishop", "knight", "rook"
  ];

  function standardStartingBoard() {
    const pieces = [];

    for (let file = 0; file < STANDARD_SIZE; file++) {
      // rank 0 = white's back rank, rank 7 = black's back rank, per
      // contracts/board-state.md ({file:0, rank:0} is white's bottom-left).
      pieces.push({ square: { file, rank: 0 }, color: "white", type: BACK_RANK[file] });
      pieces.push({ square: { file, rank: 1 }, color: "white", type: "pawn" });
      pieces.push({ square: { file, rank: STANDARD_SIZE - 2 }, color: "black", type: "pawn" });
      pieces.push({ square: { file, rank: STANDARD_SIZE - 1 }, color: "black", type: BACK_RANK[file] });
    }

    return { size: STANDARD_SIZE, pieces };
  }

  // A fresh GameState. Castling rights start true because on this board every
  // king and rook is on its home square; game-state.md §7 requires them to be
  // maintained correctly for position identity even though moves.ts never
  // generates a castling move. applyMove narrows them; nothing here sets one
  // back to true. history starts empty — applyMove appends one key per move.
  function newGame() {
    return {
      board: standardStartingBoard(),
      sideToMove: "white",
      castling: {
        whiteKingside: true,
        whiteQueenside: true,
        blackKingside: true,
        blackQueenside: true
      },
      enPassantTarget: null,
      history: []
    };
  }

  // ======================================================================
  // Game state (owned by game.js) and screen state (owned by this file).
  // ======================================================================

  let state = null;            // GameState | null — only set once Play is pressed

  // --- Screen state. None of this is ever written into GameState or Board. ---
  let colorChoice = "white";   // "white" | "black" | "random" — the setup pick
  let playingAs = null;        // "white" | "black" — resolved when Play is pressed
  let selectedSquare = null;   // Square | null
  let selectedMoves = [];      // Move[] — exactly what legalMovesFrom returned

  const GLYPHS = {
    white: { king: "♔", queen: "♕", rook: "♖", bishop: "♗", knight: "♘", pawn: "♙" },
    black: { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" }
  };

  function pieceAt(square) {
    return state.board.pieces.find(
      p => p.square.file === square.file && p.square.rank === square.rank
    );
  }

  function squareEquals(a, b) {
    return a.file === b.file && a.rank === b.rank;
  }

  // ======================================================================
  // Setup screen
  // ======================================================================

  const setupScreenEl = document.getElementById("setup-screen");
  const gameScreenEl = document.getElementById("game-screen");
  const colorChoiceEl = document.getElementById("color-choice");
  const playButtonEl = document.getElementById("play-button");

  function renderColorChoice() {
    for (const button of colorChoiceEl.querySelectorAll(".color-option")) {
      button.setAttribute(
        "aria-pressed",
        button.dataset.choice === colorChoice ? "true" : "false"
      );
    }
  }

  colorChoiceEl.addEventListener("click", event => {
    const button = event.target.closest(".color-option");
    if (!button) return;

    colorChoice = button.dataset.choice;
    renderColorChoice();
  });

  playButtonEl.addEventListener("click", () => {
    // "Random" resolves here, at the moment Play is pressed. The resolved
    // colour is screen state: it decides draw order and nothing else.
    playingAs = colorChoice === "random"
      ? (Math.random() < 0.5 ? "white" : "black")
      : colorChoice;

    state = newGame();
    selectedSquare = null;
    selectedMoves = [];

    setupScreenEl.hidden = true;
    gameScreenEl.hidden = false;

    render();
  });

  // ======================================================================
  // Game screen
  // ======================================================================

  function handleSquareClick(square) {
    if (selectedSquare && squareEquals(selectedSquare, square)) {
      // Tapping the selected piece again deselects.
      selectedSquare = null;
      selectedMoves = [];
      render();
      return;
    }

    if (selectedSquare) {
      // Is this square one of the legal destinations for the selection?
      // Pass back the SAME Move object legalMovesFrom returned — never a
      // reconstructed { from, to } pair.
      const move = selectedMoves.find(m => squareEquals(m.to, square));

      if (move) {
        const result = applyMove(state, move);

        selectedSquare = null;
        selectedMoves = [];

        if (result.ok) {
          state = result.state;
        }
        // On rejection: selection is already cleared above, nothing else
        // happens. No alert, no error text.

        render();
        return;
      }
    }

    // Not completing a move: try starting a new selection. legalMovesFrom
    // itself returns [] for an empty square, for a piece belonging to the
    // side not to move, and for a piece with no move that keeps its own king
    // safe — so no turn check and no rules reasoning happens here.
    const moves = legalMovesFrom(state, square);

    if (moves.length > 0) {
      selectedSquare = square;
      selectedMoves = moves;
    } else {
      selectedSquare = null;
      selectedMoves = [];
    }

    render();
  }

  // Whose turn it is plus the outcome, in words a 6-year-old can read.
  // Everything here comes from gameStatus/sideToMove; nothing is worked out
  // on this side of the boundary.
  function statusText() {
    const turn = sideToMove(state);
    const mover = turn === "white" ? "White" : "Black";
    const other = turn === "white" ? "Black" : "White";

    switch (gameStatus(state)) {
      case "checkmate":
        return `Checkmate! ${other} wins the game.`;
      case "stalemate":
        return `${mover} has no moves left. It's a tie!`;
      case "repetition-draw":
        return "The same position came up three times. It's a tie!";
      case "check":
        return `${mover}'s turn. Look out — your king is in check!`;
      default:
        return `${mover}'s turn.`;
    }
  }

  // Draw order. Board state is always described from white's perspective, so
  // rank 0 is white's home rank in the data no matter who is looking. For a
  // white player the highest rank is drawn at the top; for a black player the
  // whole board is turned around — ranks bottom-to-top and files right-to-
  // left. The coordinates themselves are never touched: a {file, rank} pair
  // means the same square either way.
  function ranksTopToBottom(size) {
    const ranks = [];
    for (let rank = 0; rank < size; rank++) ranks.push(rank);
    return playingAs === "white" ? ranks.reverse() : ranks;
  }

  function filesLeftToRight(size) {
    const files = [];
    for (let file = 0; file < size; file++) files.push(file);
    return playingAs === "white" ? files : files.reverse();
  }

  function render() {
    const board = state.board;

    document.getElementById("status-line").textContent = statusText();

    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    boardEl.style.gridTemplateColumns = `repeat(${board.size}, 72px)`;
    boardEl.style.gridTemplateRows = `repeat(${board.size}, 72px)`;

    for (const rank of ranksTopToBottom(board.size)) {
      for (const file of filesLeftToRight(board.size)) {
        const square = { file, rank };
        const squareEl = document.createElement("div");
        const isLight = (file + rank) % 2 === 1;
        squareEl.className = `square ${isLight ? "light" : "dark"}`;

        const piece = pieceAt(square);

        if (selectedSquare && squareEquals(selectedSquare, square)) {
          squareEl.classList.add("selected");
        }

        const isHighlighted = selectedMoves.some(m => squareEquals(m.to, square));
        if (isHighlighted) {
          squareEl.classList.add("highlight");
          if (piece) {
            squareEl.classList.add("occupied");
          }
        }

        if (piece) {
          const pieceEl = document.createElement("span");
          pieceEl.className = `piece ${piece.color}`;
          pieceEl.textContent = GLYPHS[piece.color][piece.type];
          squareEl.appendChild(pieceEl);
        }

        squareEl.addEventListener("click", () => handleSquareClick(square));
        boardEl.appendChild(squareEl);
      }
    }
  }

  renderColorChoice();
</script>
</body>
</html>
