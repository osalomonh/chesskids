<!--
  Build:
    npm run build
    (only needed once, or whenever moves.ts/game.ts change; produces
    moves.js and game.js as ESM)

  Serve (ES modules do not load over file://):
    python -m http.server 8000

  View:
    http://localhost:8000/board.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Board</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2b2b2b;
    font-family: sans-serif;
  }

  /* Off the board, not on it: a turn indicator lives here, not in a square. */
  #turn-indicator {
    margin-bottom: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 18px;
    color: #eee;
    background: #1a1a1a;
  }

  #board {
    display: grid;
    border: 4px solid #1a1a1a;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }

  .square {
    width: 72px;
    height: 72px;
    min-width: 60px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    user-select: none;
    cursor: pointer;
  }

  .square.light {
    background: #f0d9b5;
  }

  .square.dark {
    background: #b58863;
  }

  .square.selected {
    outline: 4px solid #2e9bff;
    outline-offset: -4px;
  }

  .square.highlight::after {
    content: "";
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: rgba(30, 130, 30, 0.65);
  }

  /* When the highlighted square is occupied (a capture), show a ring
     instead of a dot, so the destination is still visible under the piece. */
  .square.highlight.occupied::after {
    width: 82%;
    height: 82%;
    background: transparent;
    border: 6px solid rgba(200, 30, 30, 0.65);
    box-sizing: border-box;
  }

  .piece {
    font-size: 48px;
    line-height: 1;
    pointer-events: none;
    z-index: 1;
  }

  .piece.white {
    color: #fefefe;
    text-shadow: 0 0 2px #000, 0 0 2px #000;
  }

  .piece.black {
    color: #111;
  }
</style>
</head>
<body>
<div id="turn-indicator"></div>
<div id="board"></div>

<script type="module">
  import { applyMove, legalMovesFrom, sideToMove } from "./game.js";

  // --- Starting position (from white's perspective, per contracts/board-state.md) ---
  // 5x5 board with pieces for both colours, so turn alternation is visible:
  // a knight and a king for each side, mirrored across the board.
  const startingBoard = {
    size: 5,
    pieces: [
      { square: { file: 0, rank: 0 }, color: "white", type: "king" },
      { square: { file: 2, rank: 1 }, color: "white", type: "knight" },
      { square: { file: 4, rank: 4 }, color: "black", type: "king" },
      { square: { file: 2, rank: 3 }, color: "black", type: "knight" }
    ]
  };

  // --- GameState: the page's single source of truth. Per contracts/game-state.md
  // §13, castling rights are all false and enPassantTarget is null on a small
  // board — that is correct, not a placeholder.
  let state = {
    board: startingBoard,
    sideToMove: "white",
    castling: {
      whiteKingside: false,
      whiteQueenside: false,
      blackKingside: false,
      blackQueenside: false
    },
    enPassantTarget: null,
    history: []
  };

  // --- Screen state (selection/highlight). Never written into GameState. ---
  let selectedSquare = null;   // Square | null
  let selectedMoves = [];      // Move[] — exactly what legalMovesFrom returned

  const GLYPHS = {
    white: { king: "♔", queen: "♕", rook: "♖", bishop: "♗", knight: "♘", pawn: "♙" },
    black: { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" }
  };

  function pieceAt(square) {
    return state.board.pieces.find(
      p => p.square.file === square.file && p.square.rank === square.rank
    );
  }

  function squareEquals(a, b) {
    return a.file === b.file && a.rank === b.rank;
  }

  function handleSquareClick(square) {
    if (selectedSquare && squareEquals(selectedSquare, square)) {
      // Clicking the selected piece again deselects.
      selectedSquare = null;
      selectedMoves = [];
      render();
      return;
    }

    if (selectedSquare) {
      // Is this square one of the legal destinations for the selection?
      // Pass back the SAME Move object legalMovesFrom returned — never a
      // reconstructed { from, to } pair.
      const move = selectedMoves.find(m => squareEquals(m.to, square));

      if (move) {
        const result = applyMove(state, move);

        selectedSquare = null;
        selectedMoves = [];

        if (result.ok) {
          state = result.state;
        }
        // On rejection: selection is already cleared above, no other change.

        render();
        return;
      }
    }

    // Not completing a move: try starting a new selection. legalMovesFrom
    // itself returns [] for an empty square or a piece belonging to the
    // side not to move, so no turn check is needed here.
    const moves = legalMovesFrom(state, square);

    if (moves.length > 0) {
      selectedSquare = square;
      selectedMoves = moves;
    } else {
      selectedSquare = null;
      selectedMoves = [];
    }

    render();
  }

  function render() {
    const board = state.board;

    const indicatorEl = document.getElementById("turn-indicator");
    indicatorEl.textContent =
      sideToMove(state) === "white" ? "White to move" : "Black to move";

    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    boardEl.style.gridTemplateColumns = `repeat(${board.size}, 72px)`;
    boardEl.style.gridTemplateRows = `repeat(${board.size}, 72px)`;

    // Rank 0 is white's home rank and must render at the bottom, so rows
    // are drawn top-to-bottom from the highest rank down to 0.
    for (let rank = board.size - 1; rank >= 0; rank--) {
      for (let file = 0; file < board.size; file++) {
        const square = { file, rank };
        const squareEl = document.createElement("div");
        const isLight = (file + rank) % 2 === 1;
        squareEl.className = `square ${isLight ? "light" : "dark"}`;

        const piece = pieceAt(square);

        if (selectedSquare && squareEquals(selectedSquare, square)) {
          squareEl.classList.add("selected");
        }

        const isHighlighted = selectedMoves.some(m => squareEquals(m.to, square));
        if (isHighlighted) {
          squareEl.classList.add("highlight");
          if (piece) {
            squareEl.classList.add("occupied");
          }
        }

        if (piece) {
          const pieceEl = document.createElement("span");
          pieceEl.className = `piece ${piece.color}`;
          pieceEl.textContent = GLYPHS[piece.color][piece.type];
          squareEl.appendChild(pieceEl);
        }

        squareEl.addEventListener("click", () => handleSquareClick(square));
        boardEl.appendChild(squareEl);
      }
    }
  }

  render();
</script>
</body>
</html>
