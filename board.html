<!--
  Build:
    npx tsc moves.ts --module es2020 --target es2020
    (only needed once, or whenever moves.ts changes; produces moves.js as ESM)

  Serve (ES modules do not load over file://):
    python -m http.server 8000

  View:
    http://localhost:8000/board.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Board</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2b2b2b;
    font-family: sans-serif;
  }

  #board {
    display: grid;
    border: 4px solid #1a1a1a;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }

  .square {
    width: 72px;
    height: 72px;
    min-width: 60px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    user-select: none;
    cursor: pointer;
  }

  .square.light {
    background: #f0d9b5;
  }

  .square.dark {
    background: #b58863;
  }

  .square.selected {
    outline: 4px solid #2e9bff;
    outline-offset: -4px;
  }

  .square.highlight::after {
    content: "";
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: rgba(30, 130, 30, 0.65);
  }

  /* When the highlighted square is occupied (a capture), show a ring
     instead of a dot, so the destination is still visible under the piece. */
  .square.highlight.occupied::after {
    width: 82%;
    height: 82%;
    background: transparent;
    border: 6px solid rgba(200, 30, 30, 0.65);
    box-sizing: border-box;
  }

  .piece {
    font-size: 48px;
    line-height: 1;
    pointer-events: none;
    z-index: 1;
  }

  .piece.white {
    color: #fefefe;
    text-shadow: 0 0 2px #000, 0 0 2px #000;
  }

  .piece.black {
    color: #111;
  }
</style>
</head>
<body>
<div id="board"></div>

<script type="module">
  import {
    kingMoves,
    queenMoves,
    rookMoves,
    bishopMoves,
    knightMoves,
    pawnMoves
  } from "./moves.js";

  // --- Board state (from white's perspective, per contracts/board-state.md) ---
  // 5x5 board, single white knight on a centre square so several of its
  // eight destinations land on-board.
  const board = {
    size: 5,
    pieces: [
      { square: { file: 2, rank: 2 }, color: "white", type: "knight" }
    ]
  };

  // --- Screen state (selection/highlight). Never written into `board`. ---
  let selectedSquare = null;   // Square | null
  let highlightSquares = [];   // Square[]

  const GLYPHS = {
    white: { king: "♔", queen: "♕", rook: "♖", bishop: "♗", knight: "♘", pawn: "♙" },
    black: { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" }
  };

  function pieceAt(square) {
    return board.pieces.find(
      p => p.square.file === square.file && p.square.rank === square.rank
    );
  }

  // Dispatch from piece type to the matching move function. This switch is
  // the consumer-side dispatch called for in the contract (gap 1 resolution) —
  // moves.ts does not choose between the six functions itself.
  function movesFor(piece) {
    switch (piece.type) {
      case "king":   return kingMoves(piece.square, board);
      case "queen":  return queenMoves(piece.square, board);
      case "rook":   return rookMoves(piece.square, board);
      case "bishop": return bishopMoves(piece.square, board);
      case "knight": return knightMoves(piece.square, board);
      // pawnMoves has a different signature (gap 2): it needs colour
      // explicitly, since it predates colour existing on Piece.
      case "pawn":   return pawnMoves(piece.square, board, piece.color);
    }
  }

  function squareEquals(a, b) {
    return a.file === b.file && a.rank === b.rank;
  }

  function handleSquareClick(square) {
    const piece = pieceAt(square);

    if (selectedSquare && squareEquals(selectedSquare, square)) {
      // Clicking the selected piece again deselects.
      selectedSquare = null;
      highlightSquares = [];
    } else if (piece) {
      // Only ever call a move function for a square confirmed to hold a
      // piece (gap 3: empty-square behaviour is not sensible to rely on).
      selectedSquare = square;
      highlightSquares = movesFor(piece);
    } else {
      // Clicking an empty square with nothing selected, or clicking
      // elsewhere while something is selected, clears the selection.
      selectedSquare = null;
      highlightSquares = [];
    }

    render();
  }

  function render() {
    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    boardEl.style.gridTemplateColumns = `repeat(${board.size}, 72px)`;
    boardEl.style.gridTemplateRows = `repeat(${board.size}, 72px)`;

    // Rank 0 is white's home rank and must render at the bottom, so rows
    // are drawn top-to-bottom from the highest rank down to 0.
    for (let rank = board.size - 1; rank >= 0; rank--) {
      for (let file = 0; file < board.size; file++) {
        const square = { file, rank };
        const squareEl = document.createElement("div");
        const isLight = (file + rank) % 2 === 1;
        squareEl.className = `square ${isLight ? "light" : "dark"}`;

        const piece = pieceAt(square);

        if (selectedSquare && squareEquals(selectedSquare, square)) {
          squareEl.classList.add("selected");
        }

        const isHighlighted = highlightSquares.some(s => squareEquals(s, square));
        if (isHighlighted) {
          squareEl.classList.add("highlight");
          if (piece) {
            squareEl.classList.add("occupied");
          }
        }

        if (piece) {
          const pieceEl = document.createElement("span");
          pieceEl.className = `piece ${piece.color}`;
          pieceEl.textContent = GLYPHS[piece.color][piece.type];
          squareEl.appendChild(pieceEl);
        }

        squareEl.addEventListener("click", () => handleSquareClick(square));
        boardEl.appendChild(squareEl);
      }
    }
  }

  render();
</script>
</body>
</html>
